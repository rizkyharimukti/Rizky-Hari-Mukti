<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Rizky Hari Mukti — Portofolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light only;
    --bg: #FAFAF7;
    --bg-card: #F1EEE7;
    --ink: #1C1B18;
    --ink-soft: #6B6560;
    --accent: #C97F1E;
    --accent-soft: #E8C48A;
    --line: #E2DED4;
    --max: 780px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(250,250,247,0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display:flex; justify-content:space-between; align-items:center; height: 60px; }
  .logo { font-family: 'Fraunces', serif; font-weight:600; font-size: 17px; letter-spacing: -0.01em; }
  .navlinks { display:flex; gap: 20px; font-size: 15px; color: var(--ink-soft); }
  .navlinks a { text-decoration:none; transition: color .2s; }
  .navlinks a:hover, .navlinks a:focus-visible { color: var(--accent); }

  /* HERO */
  header.hero { padding: 64px 0 48px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 18px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before { content:''; width:16px; height:1px; background: var(--accent); display:inline-block; }
  .hero-top { display:flex; gap: 24px; align-items:flex-start; margin-bottom: 22px; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size: 28px; color: #fff;
    flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width:100%; height:100%; object-fit: cover; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(34px, 6vw, 46px);
    letter-spacing: -0.015em; line-height: 1.08;
  }
  .role { color: var(--ink-soft); font-size: 17px; margin-top: 8px; }
  .lede { font-size: 18px; max-width: 60ch; color: #3A3833; margin-top: 4px; }

  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border:1px solid var(--line); margin-top: 32px; }
  .stat { background: var(--bg); padding: 18px 14px; }
  .stat-num { font-family:'Fraunces', serif; font-weight:600; font-size: 27px; color: var(--accent); }
  .stat-label { font-size: 13px; color: var(--ink-soft); margin-top: 4px; line-height:1.45; }

  section { padding: 56px 0; border-top: 1px solid var(--line); }
  .section-head { display:flex; align-items:baseline; gap:12px; margin-bottom: 30px; }
  .section-num { font-family:'IBM Plex Mono', monospace; font-size: 13.5px; color: var(--accent); }
  h2 { font-family:'Fraunces', serif; font-weight: 600; font-size: 27px; letter-spacing: -0.01em; }
  .section-sub { color: var(--ink-soft); font-size: 15.5px; margin-bottom: 28px; margin-top: -18px; }

  /* JOURNEY */
  .journey { position: relative; padding-left: 26px; }
  .journey::before { content:''; position:absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .jitem { position: relative; padding-bottom: 30px; }
  .jitem:last-child { padding-bottom: 0; }
  .jitem::before {
    content:''; position:absolute; left: -26px; top: 4px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--accent);
  }
  .jitem.current::before { background: var(--accent); }
  .jtitle { font-weight: 600; font-size: 17.5px; }
  .jmeta { font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 7px; }
  .jdesc { font-size: 15.5px; color: #3A3833; max-width: 56ch; }

  /* GRID CARDS */
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--line);
    padding: 20px; transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent-soft); }
  .card-tag { font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .card h3 { font-family:'Fraunces', serif; font-weight: 600; font-size: 18.5px; margin: 8px 0 6px; }
  .card p { font-size: 14.5px; color: var(--ink-soft); }
  .card-link { display:inline-block; margin-top: 12px; font-size: 14px; color: var(--accent); text-decoration:none; border-bottom: 1px solid var(--accent-soft); }
  .card-thumb { width: calc(100% + 40px); margin: -20px -20px 14px; display:block; border-bottom: 1px solid var(--line); }
  .card.wide { grid-column: 1 / -1; }

  /* SKILLS */
  .skills { display:flex; flex-wrap: wrap; gap: 10px; }
  .skill-pill {
    font-family:'IBM Plex Mono', monospace; font-size: 13.5px;
    padding: 9px 15px; border: 1px solid var(--line); background: var(--bg);
  }

  /* CONTACT */
  footer { padding: 56px 0 64px; }
  .contact-box {
    background: var(--bg-card); border: 1px solid var(--line);
    padding: 36px 28px; text-align:left;
  }
  .contact-box h2 { color: var(--ink); }
  .contact-row { display:flex; flex-wrap:wrap; gap: 14px; margin-top: 20px; }
  .contact-item {
    font-size: 15px; padding: 11px 17px; border: 1px solid var(--line);
    background: var(--bg);
    text-decoration:none; color: var(--ink); display:flex; align-items:center; gap:8px;
    transition: border-color .2s, background .2s;
  }
  .contact-item:hover { border-color: var(--accent); background: #fff; }
  .foot-note { text-align:center; font-size: 12.5px; color: var(--ink-soft); margin-top: 40px; font-family:'IBM Plex Mono', monospace; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .hero-top { gap: 16px; }
    .avatar { width: 68px; height: 68px; font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card:hover { transform: none; }
  }
</style>
</head>
